<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Privacy Assistant</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="sidebar.css">
  <script src="theme.js"></script>
  <script src="logger.js"></script>
</head>
<body>
  <div class="sidebar-container">

    <!-- Header -->
    <header class="sidebar-header">
      <div class="sidebar-header-left">
        <div class="header-icon" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
        </div>
        <div class="header-title-group">
          <span class="header-title">Privacy Assistant</span>
          <div class="header-status">
            <span class="header-status-dot" id="headerStatusDot"></span>
            <span class="header-status-label" id="headerStatusLabel">Protected</span>
          </div>
        </div>
      </div>
      <div class="sidebar-header-right">
        <button class="header-btn" id="refreshBtn" type="button" aria-label="Refresh Context" title="Refresh Context">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"/>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
          </svg>
        </button>
        <button class="header-btn" id="settingsBtn" type="button" aria-label="Settings" title="Settings">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
        <button class="close-btn" id="closeBtn" type="button" aria-label="Close" title="Close">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Model Selector -->
    <div class="model-selector-container">
      <label for="sidebarModelSelect" class="sr-only">Model</label>
      <select id="sidebarModelSelect" class="sidebar-model-select">
        <option value="">Loading models...</option>
      </select>
    </div>

    <!-- Main Workspace -->
    <main class="sidebar-main">

      <!-- Empty State -->
      <div class="empty-state" id="emptyState">
        <div class="empty-state-icon" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
        </div>
        <h2 class="empty-title">Privacy Assistant</h2>
        <p class="empty-sub">Ask anything about this page.</p>
        <div class="suggestions">
          <button class="suggestion-row" type="button" data-prompt="Summarize this page">
            <span>Summarize this page</span>
            <span class="arrow">→</span>
          </button>
          <button class="suggestion-row" type="button" data-prompt="Explain this page">
            <span>Explain this page</span>
            <span class="arrow">→</span>
          </button>
          <button class="suggestion-row" type="button" data-prompt="Find important information on this page">
            <span>Find important information</span>
            <span class="arrow">→</span>
          </button>
        </div>
      </div>

      <!-- Conversation Stream -->
      <div class="conversation-stream" id="conversationStream" style="display: none;"></div>
      
      <!-- Confirmation Dialog -->
      <div class="confirmation-dialog" id="confirmationDialog" style="display: none;">
        <div class="confirmation-header">Action requires approval</div>
        <div class="confirmation-body">
          <p class="confirmation-text">The assistant wants to:</p>
          <p class="confirmation-target" id="confirmationActionDesc">Click "Submit Application"</p>
          <p class="confirmation-target-domain" id="confirmationDomain">Website: example.com</p>
        </div>
        <div class="confirmation-actions">
          <button type="button" id="confirmCancelBtn" class="confirm-cancel">Cancel</button>
          <button type="button" id="confirmAllowBtn" class="confirm-allow">Allow</button>
        </div>
      </div>
    </main>

    <!-- Security Context (Compact bottom bar) -->
    <div class="security-banner" id="securityBanner" style="display: none;">
      <div class="security-summary-row">
        <span class="security-icon" id="securityIcon">✓</span>
        <span class="security-text" id="securityNoticeText">Sensitive content protected locally</span>
        <button class="details-toggle" id="detailsToggle" type="button">Details →</button>
      </div>
      <div class="details-drawer" id="detailsDrawer" style="display: none;">
        <div class="details-list" id="detailsList"></div>
      </div>
    </div>

    <!-- AI Context Controls -->
    <div class="context-controls" id="contextControls">
      <p class="context-controls-label">Context</p>
      <div class="context-row">
        <span class="context-item-name">
          Text
          <span class="context-ready">Ready</span>
        </span>
        <span class="context-badge context-badge-on" aria-label="Text context always active">ON</span>
      </div>
      <div class="context-row">
        <label for="screenshotToggle" class="context-item-name">
          Screenshot
        </label>
        <label class="context-switch" aria-label="Send sanitized screenshot to AI">
          <input type="checkbox" id="screenshotToggle" role="switch"
            aria-checked="true" aria-label="Send sanitized screenshot to AI">
          <span class="context-slider" aria-hidden="true"></span>
        </label>
      </div>
      <p class="context-note" id="screenshotNote">Sanitized locally · faces blurred · PII masked</p>
    </div>

    <!-- Input Composer -->
    <div class="input-area">
      <div class="input-wrapper">
        <textarea
          id="userInput"
          placeholder="Ask about this page..."
          rows="1"
          autocomplete="off"
        ></textarea>
        <button id="sendBtn" class="send-btn" type="button" aria-label="Send" title="Send" disabled>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="19" x2="12" y2="5"/>
            <polyline points="5 12 12 5 19 12"/>
          </svg>
        </button>
      </div>
    </div>

  </div>

  <script src="sidebar.js"></script>
</body>
</html>
